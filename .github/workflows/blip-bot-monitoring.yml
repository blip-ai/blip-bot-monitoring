name: blip-bot-monitoring

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dependencies
      run: dotnet restore Blip.Ai.Bot.Monitoring.sln

    - name: Build
      run: dotnet build Blip.Ai.Bot.Monitoring.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Blip.Ai.Bot.Monitoring.sln --no-restore --verbosity normal
